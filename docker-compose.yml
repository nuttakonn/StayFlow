services:
  postgres:
    image: postgres:17-alpine
    container_name: stayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-stayflow_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayflow_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayflow_app} -d ${POSTGRES_DB:-stayflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
